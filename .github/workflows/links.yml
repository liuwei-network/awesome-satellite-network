name: Link check

on:
  push:
    branches:
      - master
    paths:
      - "**/*.md"
      - "CITATION.bib"
      - ".lychee.toml"
      - ".github/workflows/links.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "CITATION.bib"
      - ".lychee.toml"
      - ".github/workflows/links.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml "./**/*.md" "CITATION.bib"
          fail: true
